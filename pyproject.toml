[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
]

[tool.ruff.lint.isort]
known-first-party = ["drift_guardian"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
