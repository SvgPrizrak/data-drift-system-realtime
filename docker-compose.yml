services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic ${KAFKA_TOPIC:-features-stream} \
          --partitions 1 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --describe \
          --topic ${KAFKA_TOPIC:-features-stream}
    restart: "no"

  drift-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-features-stream}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-drift-consumer}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      PROMETHEUS_PORT: 8000
      WINDOW_SIZE: ${WINDOW_SIZE:-1000}
      MIN_WINDOW_SIZE: ${MIN_WINDOW_SIZE:-300}
      ANALYZE_EVERY_N_EVENTS: ${ANALYZE_EVERY_N_EVENTS:-1}
      LATE_EVENT_THRESHOLD_SECONDS: ${LATE_EVENT_THRESHOLD_SECONDS:-60}
      STREAM_WARNING_LAG_SECONDS: ${STREAM_WARNING_LAG_SECONDS:-60}
      STREAM_CRITICAL_LAG_SECONDS: ${STREAM_CRITICAL_LAG_SECONDS:-300}
      INVALID_EVENT_RATE_WARNING: ${INVALID_EVENT_RATE_WARNING:-0.01}
      INVALID_EVENT_RATE_CRITICAL: ${INVALID_EVENT_RATE_CRITICAL:-0.05}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 20s
    restart: unless-stopped

  drift-producer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "-m", "drift_guardian.realtime.producer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-features-stream}
      PRODUCER_INTERVAL_SECONDS: ${PRODUCER_INTERVAL_SECONDS:-0.2}
      PRODUCER_SEED: ${PRODUCER_SEED:-42}
      PRODUCER_DRIFT_AFTER_EVENTS: ${PRODUCER_DRIFT_AFTER_EVENTS:-700}
    stop_grace_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    depends_on:
      drift-consumer:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  prometheus-data:
